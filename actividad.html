<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad de análisis</title>
</head>
<body>

    <h2>Ejemplo de innerHTML y textContent</h2>

    <p id="ejemplo1"></p>
    <p id="ejemplo2"></p>

    <script>
        document.getElementById("ejemplo1").innerHTML = "<strong>Hola</strong>";

        document.getElementById("ejemplo2").textContent = "<strong>Hola</strong>";
    </script>

</body>
</html>
